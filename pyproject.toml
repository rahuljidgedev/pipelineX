[tool.poetry]
name = "ai-factory"
version = "0.1.0"
description = "AI Software Factory for autonomous development"
authors = ["Rahul Jidge"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^1.1.3"
fastapi = "^0.110.0"
uvicorn = "^0.27.0"
openai = "^1.0.0"
python-dotenv = "^1.0.1"
pydantic = "^2.6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
